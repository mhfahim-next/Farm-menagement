name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build
        run: npm run build
        env:
          # The build doesn't need a real database; pages read it at request time.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          NEXT_PUBLIC_SITE_URL: https://www.farmflows.app
          NEXT_TELEMETRY_DISABLED: "1"
      - name: No known vulnerabilities in production dependencies
        run: npm audit --omit=dev --audit-level=high

  mobile:
    name: Android app (lint, types, tests, bundle)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci
      - name: Bundle for Android
        run: npx expo export --platform android --output-dir /tmp/android-bundle
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://ci.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder

  database:
    name: Migrations and database rules
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start Supabase and apply every migration
        run: npx supabase start -x realtime,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Database checks
        # psql inside the database container (project_id "farm-management" in supabase/config.toml)
        run: docker exec -i supabase_db_farm-management psql -U postgres -v ON_ERROR_STOP=1 < tests/sql/checks.sql
      - name: Stop Supabase
        if: always()
        run: npx supabase stop --no-backup
